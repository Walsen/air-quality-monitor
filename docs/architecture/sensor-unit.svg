<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
    <pattern id="cells" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#1e3a8a"/><path d="M0,0 H12 V12" fill="none" stroke="#93c5fd" stroke-width="0.8"/></pattern>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Low-cost air-quality sensor unit — reference hardware model</text>
  <text x="480" y="50" text-anchor="middle" fill="#64748b">Generic illustration based on docs/architecture/01-sensor-simulator-service.md (what each virtual sensor emulates)</text>

  <!-- ===== Left: street installation ===== -->
  <rect x="20" y="70" width="300" height="490" rx="8" fill="url(#sky)" stroke="#cbd5e1"/>
  <text x="170" y="92" text-anchor="middle" font-weight="bold" fill="#0f172a">Installation</text>

  <!-- ground / kerb -->
  <rect x="20" y="500" width="300" height="60" fill="#94a3b8"/>
  <rect x="20" y="494" width="170" height="8" fill="#e2e8f0"/>
  <text x="250" y="535" text-anchor="middle" fill="#f8fafc" font-size="12">road</text>
  <text x="95" y="520" text-anchor="middle" fill="#334155" font-size="12">pavement / kerb</text>

  <!-- lamppost -->
  <rect x="96" y="120" width="12" height="376" fill="#475569"/>
  <path d="M102,122 Q102,105 130,105 L190,105" fill="none" stroke="#475569" stroke-width="8"/>
  <rect x="180" y="100" width="34" height="12" rx="3" fill="#475569"/>
  <ellipse cx="197" cy="116" rx="14" ry="5" fill="#fde68a"/>

  <!-- solar panel -->
  <g transform="translate(108,212) rotate(-28)">
    <rect x="0" y="0" width="70" height="40" fill="url(#cells)" stroke="#0f172a"/>
  </g>
  <line x1="108" y1="240" x2="122" y2="232" stroke="#475569" stroke-width="3"/>

  <!-- unit on pole -->
  <rect x="108" y="262" width="16" height="6" fill="#334155"/>
  <rect x="108" y="300" width="16" height="6" fill="#334155"/>
  <rect x="124" y="252" width="62" height="66" rx="6" fill="url(#box)" stroke="#334155" stroke-width="1.5"/>
  <line x1="176" y1="252" x2="182" y2="232" stroke="#334155" stroke-width="2"/>
  <circle cx="182" cy="230" r="3" fill="#334155"/>
  <rect x="134" y="318" width="42" height="8" rx="2" fill="#64748b"/>
  <text x="155" y="290" text-anchor="middle" font-size="10" fill="#334155">AQ unit</text>

  <!-- height marker -->
  <line x1="240" y1="285" x2="240" y2="494" stroke="#0f172a" stroke-dasharray="4 3" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="248" y="395" fill="#0f172a">~2–3 m</text>
  <text x="248" y="411" fill="#64748b" font-size="11">above ground,</text>
  <text x="248" y="425" fill="#64748b" font-size="11">metres from kerb</text>

  <text x="30" y="160" fill="#334155" font-size="11">solar panel</text>
  <text x="30" y="174" fill="#334155" font-size="11">(or mains)</text>
  <line x1="88" y1="180" x2="118" y2="215" stroke="#94a3b8"/>

  <!-- zoom lines -->
  <line x1="186" y1="252" x2="360" y2="100" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <line x1="186" y1="326" x2="360" y2="540" stroke="#94a3b8" stroke-dasharray="3 3"/>

  <!-- ===== Right: cutaway ===== -->
  <rect x="360" y="100" width="420" height="440" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text x="570" y="90" text-anchor="middle" font-weight="bold" fill="#0f172a">Inside the weatherproof enclosure (cutaway)</text>

  <!-- antenna -->
  <line x1="730" y1="100" x2="750" y2="60" stroke="#334155" stroke-width="3"/>
  <circle cx="750" cy="58" r="4" fill="#334155"/>

  <!-- PM sensor -->
  <rect x="380" y="120" width="190" height="130" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="475" y="140" text-anchor="middle" font-weight="bold" fill="#7f1d1d">PM2.5 optical sensor</text>
  <rect x="395" y="152" width="160" height="70" rx="4" fill="#ffffff" stroke="#b91c1c"/>
  <rect x="402" y="178" width="22" height="16" fill="#b91c1c"/>
  <text x="413" y="210" text-anchor="middle" font-size="9" fill="#7f1d1d">laser</text>
  <line x1="424" y1="186" x2="520" y2="186" stroke="#ef4444" stroke-width="2"/>
  <circle cx="460" cy="182" r="2.5" fill="#475569"/><circle cx="478" cy="191" r="3.5" fill="#475569"/><circle cx="494" cy="184" r="2" fill="#475569"/>
  <path d="M478,191 L500,212" stroke="#f97316" stroke-dasharray="2 2"/>
  <rect x="496" y="208" width="22" height="10" fill="#0f172a"/>
  <text x="530" y="217" font-size="9" fill="#7f1d1d">photo-</text>
  <text x="530" y="227" font-size="9" fill="#7f1d1d">detector</text>
  <circle cx="540" cy="168" r="10" fill="none" stroke="#7f1d1d"/>
  <path d="M533,168 L547,168 M540,161 L540,175" stroke="#7f1d1d"/>
  <text x="475" y="242" text-anchor="middle" font-size="11" fill="#7f1d1d">light scattering · humidity-sensitive</text>

  <!-- NO2 cell -->
  <rect x="585" y="120" width="180" height="130" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="675" y="140" text-anchor="middle" font-weight="bold" fill="#78350f">NO2 electrochemical cell</text>
  <ellipse cx="675" cy="168" rx="40" ry="10" fill="#fcd34d" stroke="#b45309"/>
  <rect x="635" y="168" width="80" height="44" fill="#fcd34d" stroke="#b45309"/>
  <ellipse cx="675" cy="212" rx="40" ry="10" fill="#fbbf24" stroke="#b45309"/>
  <line x1="660" y1="222" x2="660" y2="232" stroke="#78350f" stroke-width="2"/><line x1="675" y1="222" x2="675" y2="232" stroke="#78350f" stroke-width="2"/><line x1="690" y1="222" x2="690" y2="232" stroke="#78350f" stroke-width="2"/>
  <text x="675" y="245" text-anchor="middle" font-size="11" fill="#78350f">temp cross-sensitivity · drift</text>

  <!-- Met sensor -->
  <rect x="380" y="265" width="190" height="70" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="475" y="288" text-anchor="middle" font-weight="bold" fill="#14532d">Met sensor</text>
  <text x="475" y="306" text-anchor="middle" fill="#14532d">temperature · humidity</text>
  <text x="475" y="322" text-anchor="middle" fill="#14532d">pressure</text>

  <!-- MCU -->
  <rect x="585" y="265" width="180" height="120" rx="8" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="675" y="288" text-anchor="middle" font-weight="bold" fill="#312e81">Controller (MCU)</text>
  <rect x="645" y="298" width="60" height="40" fill="#312e81"/>
  <g stroke="#312e81" stroke-width="2">
    <line x1="652" y1="293" x2="652" y2="298"/><line x1="664" y1="293" x2="664" y2="298"/><line x1="676" y1="293" x2="676" y2="298"/><line x1="688" y1="293" x2="688" y2="298"/><line x1="700" y1="293" x2="700" y2="298"/>
    <line x1="652" y1="338" x2="652" y2="343"/><line x1="664" y1="338" x2="664" y2="343"/><line x1="676" y1="338" x2="676" y2="343"/><line x1="688" y1="338" x2="688" y2="343"/><line x1="700" y1="338" x2="700" y2="343"/>
  </g>
  <text x="675" y="360" text-anchor="middle" font-size="11" fill="#312e81">samples every 1 min</text>
  <text x="675" y="375" text-anchor="middle" font-size="11" fill="#312e81">publishes 1-hour averages</text>

  <!-- Power -->
  <rect x="380" y="350" width="190" height="90" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="475" y="372" text-anchor="middle" font-weight="bold" fill="#1e293b">Power</text>
  <rect x="405" y="385" width="60" height="30" rx="3" fill="#ffffff" stroke="#475569"/>
  <rect x="465" y="393" width="6" height="14" fill="#475569"/>
  <rect x="408" y="388" width="40" height="24" fill="#22c55e"/>
  <text x="510" y="398" font-size="11" fill="#1e293b">mains or</text>
  <text x="510" y="412" font-size="11" fill="#1e293b">solar + battery</text>
  <text x="475" y="432" text-anchor="middle" font-size="11" fill="#475569">reports battery / solar state</text>

  <!-- Modem -->
  <rect x="585" y="400" width="180" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="675" y="422" text-anchor="middle" font-weight="bold" fill="#0c4a6e">Cellular modem + SIM</text>
  <text x="675" y="440" text-anchor="middle" font-size="11" fill="#0c4a6e">global roaming</text>
  <text x="675" y="456" text-anchor="middle" font-size="11" fill="#0c4a6e">signal quality · fault flags</text>
  <line x1="745" y1="400" x2="735" y2="104" stroke="#0369a1" stroke-dasharray="3 2"/>

  <!-- Air inlet -->
  <g stroke="#64748b" stroke-width="2">
    <line x1="400" y1="540" x2="400" y2="528"/><line x1="415" y1="540" x2="415" y2="528"/><line x1="430" y1="540" x2="430" y2="528"/><line x1="445" y1="540" x2="445" y2="528"/><line x1="460" y1="540" x2="460" y2="528"/>
  </g>
  <text x="480" y="522" fill="#64748b" font-size="11">louvred air inlet (underside)</text>
  <path d="M430,575 L430,548" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="440" y="580" fill="#0369a1" font-size="11">ambient air</text>

  <!-- internal bus -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <path d="M570,185 H578 V325 H585"/>
    <path d="M675,250 V265"/>
    <path d="M570,300 H585"/>
    <path d="M570,395 H578 V375 H585"/>
    <path d="M675,385 V400"/>
  </g>

  <!-- ===== Output ===== -->
  <path d="M760,58 C800,58 820,70 830,110" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="800" y="115" width="145" height="150" rx="8" fill="#ffffff" stroke="#334155"/>
  <text x="872" y="137" text-anchor="middle" font-weight="bold" fill="#0f172a">Data out</text>
  <text x="872" y="157" text-anchor="middle" fill="#334155">MQTT / HTTPS</text>
  <text x="872" y="173" text-anchor="middle" fill="#334155">to cloud</text>
  <line x1="815" y1="185" x2="930" y2="185" stroke="#e2e8f0"/>
  <text x="815" y="203" font-size="11" fill="#475569">PM2.5 (µg/m³)</text>
  <text x="815" y="219" font-size="11" fill="#475569">NO2 (µg/m³)</text>
  <text x="815" y="235" font-size="11" fill="#475569">temp · RH · pressure</text>
  <text x="815" y="251" font-size="11" fill="#475569">housekeeping</text>

  <rect x="800" y="285" width="145" height="100" rx="8" fill="#f0fdf4" stroke="#15803d"/>
  <text x="872" y="307" text-anchor="middle" font-weight="bold" fill="#14532d">In this repo</text>
  <text x="872" y="327" text-anchor="middle" font-size="11" fill="#14532d">emulated in software by</text>
  <text x="872" y="343" text-anchor="middle" font-size="11" fill="#14532d">sensor-simulator/</text>
  <text x="872" y="363" text-anchor="middle" font-size="11" fill="#14532d">(one state machine</text>
  <text x="872" y="377" text-anchor="middle" font-size="11" fill="#14532d">per virtual sensor)</text>
</svg>
