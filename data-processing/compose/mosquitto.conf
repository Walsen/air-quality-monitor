# Local development broker for the ingestion stack.
#
# THIS CONFIGURATION IS FOR THE LOCAL STACK ONLY and deliberately differs from a deployed broker:
# AWS IoT Core requires per-device X.509 identity (§7, Requirement 29.2), which this file does not
# attempt to imitate. Requiring mutual TLS here would need certificate material that is generated
# per-developer and git-ignored, making the stack unusable on a fresh clone — so the local listener
# is plain, and it is reachable only from loopback because the Compose port mapping binds
# 127.0.0.1.

listener 1883
protocol mqtt

# Anonymous access is acceptable ONLY because of that loopback binding. It is not a model for a
# deployed broker, where per-device certificates are the identity.
allow_anonymous true

# Single-line output to stdout so the broker's logs interleave readably with the service's own
# JSON logs under `docker compose up`.
log_dest stdout
log_type warning
log_type error
connection_messages true

# $SYS/# is what the Compose healthcheck subscribes to in order to prove the broker accepts a
# real subscription rather than merely holding a socket open.
sys_interval 1
