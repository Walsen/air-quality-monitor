# Local development broker configuration.
#
# Two listeners: a plain one on 1883 for quick local debugging, and a TLS one on
# 8883 requiring a client certificate, which is what the MQTT_Publisher connects
# to (Requirement 13.3 — TLS only, chain validated, per-sensor client identity).
#
# All material under /mosquitto/certs is generated locally by `just gen-certs`
# and is git-ignored; nothing here references a committed key (Requirement 16.8).

# Development only: no password file, so the TLS listener's client certificate is
# the authentication. Do not reuse this configuration outside local development.
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

listener 1883
protocol mqtt

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker/server.crt
keyfile /mosquitto/certs/broker/server.key
# Require and verify a client certificate against the same development CA, so a
# sensor without valid material is refused rather than silently accepted.
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
